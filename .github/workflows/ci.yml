name: CI

on:
  push:
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Unit tests
  # -----------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e . pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=qdf_bom --cov-branch --cov-report=term-missing --cov-report=xml

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  # -----------------------------------------------------------------------
  # Standalone executables (runs only after tests pass)
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: qdf-bom-linux
            exe: dist/qdf-bom
          - os: windows-latest
            artifact: qdf-bom-windows
            exe: dist/qdf-bom.exe
          - os: macos-latest
            artifact: qdf-bom-macos
            exe: dist/qdf-bom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . pyinstaller fpdf2

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name qdf-bom \
            --add-data "data/parts.json:data" \
            qdf_bom/__main__.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name qdf-bom `
            --add-data "data/parts.json;data" `
            qdf_bom/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
          if-no-files-found: error
