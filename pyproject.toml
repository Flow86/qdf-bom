[project]
name = "qdf-bom"
version = "0.1.0"
description = "QUADRO QDF → Stückliste (BOM)"
requires-python = ">=3.10"
dependencies = ["fpdf2>=2.7"]

[tool.setuptools.packages.find]
include = ["qdf_bom*"]

[project.scripts]
qdf-bom = "qdf_bom.tool:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if getattr\\(sys",
]
