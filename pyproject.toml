[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qdf-bom"
version = "0.1.0"
description = "QUADRO QDF → Stückliste (BOM)"
requires-python = ">=3.10"
dependencies = ["fpdf2>=2.7"]

[project.scripts]
qdf-bom = "qdf_bom.tool:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
